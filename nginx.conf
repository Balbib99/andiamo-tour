# Equivale a vercel.json: todas las rutas llevan a index.html y los archivos que cambian sin huella no se guardan en caché.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Comprime lo que se comprime bien. Los audios (mp3, m4a) y las fotos ya vienen comprimidos.
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Sin esto, el service worker no se actualizaría al desplegar una versión nueva.
    location ~ ^/(sw\.js|offline-manifest\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Los archivos de /assets llevan una huella en el nombre: no cambian nunca con ese nombre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fotos, guías de voz y podcasts: se revalidan; nginx admite las peticiones por rangos que usan los <audio>.
    location ~ ^/(img|audio|podcast|data|personajes|icons)/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Cualquier otra ruta de la web (/dia/3/parada/...) la resuelve la propia app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
