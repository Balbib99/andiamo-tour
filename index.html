<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#183A32" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121a18" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Andiamo: la guía interactiva para recorrer Roma a pie, con mapa, historia y audio en cada parada." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Andiamo" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Andiamo: Roma a pie" />
    <meta property="og:description" content="Guía interactiva para recorrer Roma a pie: mapa, historia, audio y podcasts en cada parada." />
    <meta name="twitter:card" content="summary" />
    <title>Andiamo</title>
    <script>
      /* Aplica el tema elegido antes de pintar, para que no haya un destello del tema contrario. */
      try {
        var t = JSON.parse(localStorage.getItem("andiamo:theme"));
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
